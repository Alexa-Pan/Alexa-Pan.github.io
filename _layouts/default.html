<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% if page.url == "/" %}<title>Alexa Pan Yue 潘悦</title>{% seo title=false %}{% else %}{% seo %}{% endif %}
    {% feed_meta %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&display=swap">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    {% if page.math %}
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] }
        };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    {% endif %}
</head>
<body{% if page.url == "/" %} class="home"{% endif %}>
    <header>
        {% if page.url == "/" %}
        <h1>Alexa Pan <span class="cn">潘悦</span></h1>
        {% elsif page.heading %}
        <h1>{{ page.heading }}</h1>
        {% endif %}
        <nav>
            <a href="{{ '/' | relative_url }}"{% if page.url == "/" %} class="active"{% endif %}>About</a>
            <a href="{{ '/blog/' | relative_url }}"{% if page.url contains "/blog" %} class="active"{% endif %}>Blog</a>
            <a href="{{ '/cv/' | relative_url }}"{% if page.url == "/cv/" %} class="active"{% endif %}>CV</a>
        </nav>
    </header>

    <main>
{{ content }}
    </main>

</body>
</html>
