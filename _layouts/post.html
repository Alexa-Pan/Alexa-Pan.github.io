---
layout: default
---
<article class="post">
    <p class="post-date">{{ page.date | date: "%B %-d, %Y" }}</p>
    <h2 class="post-title">{{ page.title }}</h2>
    <div class="post-body">
{{ content }}
    </div>
    <p class="post-back"><a href="{{ '/blog/' | relative_url }}">&larr; All posts</a></p>
</article>
